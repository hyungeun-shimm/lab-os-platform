<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Experiment Log — Lab OS</title>
<style>
  :root {
    --navy: #1E2761; --navy-deep: #131A40;
    --ice: #CADCFC; --ice-deep: #8FB3E6;
    --accent: #F2B33D;
    --grey: #5A6378; --grey-light: #ECEEF3; --grey-lighter: #F6F7FB;
    --white: #FFFFFF;
    --green: #16a34a; --red: #dc2626; --orange: #ea580c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: var(--grey-lighter); color: #1c2333; min-height: 100vh; }

  /* ── Header ── */
  header.app-top { background: var(--navy); color: var(--white); padding: 12px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.10); }
  header.app-top .brand { font-family: Georgia,serif; font-size: 18px; font-weight: 700; }
  header.app-top .brand-sub { color: var(--accent); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-left: 4px; }
  header.app-top .spacer { flex: 1; }
  header.app-top .me { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  header.app-top .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--navy-deep); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  header.app-top .role-pill { background: rgba(255,255,255,.15); color: var(--ice); padding: 2px 9px; border-radius: 999px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  header.app-top button.signout, header.app-top button.switch-mode { background: transparent; border: 1px solid rgba(255,255,255,.30); color: var(--white); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  header.app-top button.signout:hover, header.app-top button.switch-mode:hover { background: rgba(255,255,255,.10); }
  header.app-top .mode-pill { background: var(--accent); color: var(--navy-deep); padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  header.app-top .mode-pill.member { background: var(--ice-deep); color: var(--navy-deep); }
  header.app-top .breadcrumb { color: var(--ice); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  header.app-top .breadcrumb a { color: var(--ice); text-decoration: none; opacity: .7; }
  header.app-top .breadcrumb a:hover { opacity: 1; }

  /* ── Layout ── */
  .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

  /* ── Filter bar ── */
  .filter-bar {
    background: var(--white); border-radius: 12px; padding: 14px 18px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 16px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .05em; }
  .filter-group select, .filter-group input { border: 1px solid var(--grey-light); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; background: var(--white); min-width: 130px; }
  .btn-apply { background: var(--navy); color: var(--white); border: none; border-radius: 8px; padding: 8px 18px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; align-self: flex-end; }
  .btn-apply:hover { background: var(--navy-deep); }
  .btn-reset { background: transparent; border: 1px solid var(--grey-light); color: var(--grey); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; align-self: flex-end; }
  .btn-reset:hover { background: var(--grey-lighter); }

  /* ── View tabs ── */
  .view-tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .view-tab { background: var(--white); border: 1px solid var(--grey-light); color: var(--grey); border-radius: 8px; padding: 7px 18px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .view-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

  /* ── Results summary ── */
  .results-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; color: var(--grey); }
  .results-bar strong { color: #1c2333; }

  /* ── Table ── */
  .log-wrap { background: var(--white); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); overflow: auto; }
  table.log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.log-table th { background: var(--grey-lighter); color: var(--grey); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grey-light); white-space: nowrap; position: sticky; top: 0; }
  table.log-table td { padding: 9px 12px; border-bottom: 1px solid var(--grey-light); vertical-align: middle; white-space: nowrap; }
  /* Behavior pivot table (mouse-per-row) */
  table.log-table td.session-cell { min-width: 110px; white-space: normal; vertical-align: top; }
  .session-group { margin-bottom: 2px; }
  .session-date { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--navy); }
  .session-date .ok  { color: var(--green); font-size: 10px; }
  .session-date .no  { color: var(--red);   font-size: 10px; }
  .session-date .sig { font-size: 10px; color: var(--grey); }
  .session-date .memo{ font-size: 10.5px; color: var(--grey); font-weight: 400; margin-left: 2px; }
  .session-sep { border: none; border-top: 1px dashed var(--grey-light); margin: 4px 0; }
  .acclim-dates { display: flex; flex-wrap: wrap; gap: 4px; }
  .acclim-chip { font-size: 11px; background: rgba(99,102,241,.10); color: #4338ca; border-radius: 5px; padding: 1px 6px; font-weight: 600; }
  table.log-table tr:last-child td { border-bottom: none; }
  table.log-table tr:hover td { background: var(--grey-lighter); }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .chip-recording { background: rgba(30,39,97,.10); color: var(--navy); }
  .chip-acclim { background: rgba(99,102,241,.13); color: #4338ca; }
  .chip-training { background: rgba(234,88,12,.12); color: var(--orange); }
  .chip-log { background: rgba(90,99,120,.10); color: var(--grey); }
  .chip-calib-ok { background: rgba(22,163,74,.12); color: var(--green); }
  .chip-calib-no { background: rgba(220,38,38,.10); color: var(--red); }
  .entry-type-slice { color: #7c3aed; font-size: 11px; font-weight: 700; }
  .entry-type-behavior { color: #0369a1; font-size: 11px; font-weight: 700; }
  .mouse-link { color: var(--navy); font-weight: 700; text-decoration: none; cursor: pointer; }
  .mouse-link:hover { text-decoration: underline; }
  .empty-state { text-align: center; color: var(--grey); padding: 48px 20px; font-size: 14px; }

  /* ── Mouse Timeline ── */
  .timeline-wrap { display: flex; flex-direction: column; gap: 16px; }
  .mouse-card { background: var(--white); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); overflow: hidden; }
  .mouse-card-head { background: var(--navy); color: var(--white); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .mouse-card-head .mouse-id { font-size: 15px; font-weight: 700; font-family: monospace; }
  .mouse-card-head .mouse-meta { font-size: 12px; color: var(--ice); }
  .mouse-card-head .spacer { flex: 1; }
  .mouse-card-head .count { font-size: 12px; color: var(--ice); }
  .mouse-timeline { padding: 0; }
  .tl-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--grey-light); font-size: 13px; }
  .tl-row:last-child { border-bottom: none; }
  .tl-row:hover { background: var(--grey-lighter); }
  .tl-date { min-width: 88px; color: var(--grey); font-size: 12px; font-weight: 600; padding-top: 2px; }
  .tl-type { min-width: 70px; }
  .tl-body { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tl-author { min-width: 90px; display: flex; align-items: center; gap: 6px; }
  .tl-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .info-pill { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; background: var(--grey-lighter); color: #1c2333; }
  .info-pill.cond { background: rgba(30,39,97,.08); color: var(--navy); }
  .info-pill.days { background: rgba(242,179,61,.18); color: #8a5b00; }
  .info-pill.prot { background: rgba(99,102,241,.10); color: #4338ca; }
  .info-pill.signal { background: rgba(22,163,74,.10); color: var(--green); }

  .loading { text-align: center; padding: 60px; color: var(--grey); font-size: 15px; }
</style>
</head>
<body>

<header class="app-top">
  <div>
    <span class="brand">Lab OS</span><span class="brand-sub">ELN</span>
  </div>
  <div class="breadcrumb">
    <a href="/eln/">Home</a> › <strong>Experiment Log</strong>
  </div>
  <div class="spacer"></div>
  <a href="/eln/analysis" style="color:var(--ice);font-size:13px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 12px;white-space:nowrap;">⚗️ Analysis</a>
  <div class="me" id="me-area"></div>
</header>

<div class="page">

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Project</label>
      <select id="f-project"><option value="">All projects</option></select>
    </div>
    <div class="filter-group">
      <label>Type</label>
      <select id="f-type">
        <option value="">All</option>
        <option value="slice">Slice ePhys</option>
        <option value="behavior">Behavior</option>
      </select>
    </div>
    <div class="filter-group" id="f-subtype-wrap" style="display:none">
      <label>Sub-type</label>
      <select id="f-subtype">
        <option value="">All</option>
        <option value="vor_okr">VOR / OKR</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Experimenter</label>
      <select id="f-author"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Mouse ID</label>
      <input id="f-mouse" type="text" placeholder="e.g. WT3479" style="min-width:110px;" />
    </div>
    <div class="filter-group">
      <label>Cohort</label>
      <input id="f-cohort" type="text" placeholder="e.g. 0302" style="min-width:90px;" />
    </div>
    <div class="filter-group">
      <label>From</label>
      <input id="f-date-from" type="date" style="min-width:130px;" />
    </div>
    <div class="filter-group">
      <label>To</label>
      <input id="f-date-to" type="date" style="min-width:130px;" />
    </div>
    <button class="btn-apply" id="btn-apply">Apply</button>
    <button class="btn-reset" id="btn-reset">Reset</button>
  </div>

  <!-- View tabs -->
  <div class="view-tabs">
    <button class="view-tab active" data-view="log">Session Log</button>
    <button class="view-tab" data-view="timeline">Mouse Timeline</button>
  </div>

  <!-- Results summary -->
  <div class="results-bar" id="results-bar" style="display:none">
    <span id="results-count"></span>
  </div>

  <!-- Main content -->
  <div id="main-content">
    <div class="loading">Loading…</div>
  </div>

</div>

<script>
"use strict";

// ── State ─────────────────────────────────────────────────────────────────
let currentUser = null;
let allRecords    = [];
let allProjects   = [];
let allAuthors    = [];
let analysisJobs  = {};   // keyed by note_id → job result
let currentView = "log";
let logSubTab   = "behavior";  // "behavior" | "slice"

// ── Helpers ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function escHtml(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${m}/${d}/${y}`;
}
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/eln/login"; throw new Error("401"); }
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.status); }
  return r.json();
}

// ── Auth / boot ───────────────────────────────────────────────────────────
async function boot() {
  try { currentUser = await api("GET", "/api/eln/auth/me"); }
  catch { return; }
  renderHeader();
  populateFilters({ records: [], projects: [], authors: [] });
  // Apply URL params as initial filter values
  const qp = new URLSearchParams(location.search);
  if (qp.get("experiment_type")) $("f-type").value = qp.get("experiment_type");
  if (qp.get("project_slug"))    $("f-project").value = qp.get("project_slug");
  if (qp.get("mouse_id"))        $("f-mouse").value = qp.get("mouse_id");
  if (qp.get("cohort"))          $("f-cohort").value = qp.get("cohort");
  $("f-subtype-wrap").style.display = $("f-type").value === "behavior" ? "" : "none";
  await load();
}

function renderHeader() {
  const u = currentUser;
  const initials = u.initials || (u.display_name || u.username || "?")[0].toUpperCase();
  const modePill = u.effective_role === "admin"
    ? `<span class="mode-pill">Admin</span>`
    : `<span class="mode-pill member">Member</span>`;
  $("me-area").innerHTML = `
    <div class="avatar" style="background:${escHtml(u.color||"#F2B33D")}">${escHtml(initials)}</div>
    <span>${escHtml(u.display_name || u.username)}</span>
    ${modePill}
    ${u.role === "admin" ? `<button class="switch-mode" onclick="switchMode()">Switch mode</button>` : ""}
    <button class="signout" onclick="signOut()">Sign out</button>`;
}

async function signOut() {
  await api("POST", "/api/eln/auth/logout");
  location.href = "/eln/login";
}
async function switchMode() {
  const mode = currentUser.effective_role === "admin" ? "member" : "admin";
  await api("POST", "/api/eln/auth/set-mode", { mode });
  currentUser = await api("GET", "/api/eln/auth/me");
  renderHeader();
  await load();
}

// ── Filters ───────────────────────────────────────────────────────────────
function populateFilters(data) {
  // Projects
  const fp = $("f-project");
  const selProj = fp.value;
  fp.innerHTML = `<option value="">All projects</option>` +
    data.projects.map(p => `<option value="${escHtml(p.slug)}" ${selProj===p.slug?"selected":""}>${escHtml(p.title)}</option>`).join("");

  // Authors
  const fa = $("f-author");
  const selAuth = fa.value;
  fa.innerHTML = `<option value="">All experimenters</option>` +
    data.authors.map(a => `<option value="${escHtml(a.id)}" ${selAuth===a.id?"selected":""}>${escHtml(a.name)}</option>`).join("");
}

function collectFilters() {
  return {
    project_slug: $("f-project").value || null,
    experiment_type: $("f-type").value || null,
    sub_type: $("f-subtype").value || null,
    author_id: $("f-author").value || null,
    mouse_id: $("f-mouse").value.trim() || null,
    cohort: $("f-cohort").value.trim() || null,
    date_from: $("f-date-from").value || null,
    date_to: $("f-date-to").value || null,
  };
}

// ── Load ──────────────────────────────────────────────────────────────────
async function load() {
  $("main-content").innerHTML = `<div class="loading">Loading…</div>`;
  const f = collectFilters();
  const params = new URLSearchParams();
  Object.entries(f).forEach(([k, v]) => { if (v) params.set(k, v); });
  try {
    const [data, jobsData] = await Promise.all([
      api("GET", `/api/eln/log?${params}`),
      api("GET", `/api/eln/analysis/jobs${f.project_slug ? `?project_slug=${encodeURIComponent(f.project_slug)}` : ""}`).catch(() => ({ jobs: [] })),
    ]);
    allRecords  = data.records  || [];
    allProjects = data.projects || [];
    allAuthors  = data.authors  || [];
    // Index all jobs by note_id for O(1) lookup in table render
    analysisJobs = {};
    for (const job of (jobsData.jobs || [])) {
      const nid = job.note_id || job.params?.note_id;
      if (nid) analysisJobs[nid] = job;   // last job wins (most recent)
    }
    populateFilters(data);
    render();
  } catch (err) {
    $("main-content").innerHTML = `<div class="empty-state">Error: ${escHtml(err.message)}</div>`;
  }
}

// ── Render dispatcher ─────────────────────────────────────────────────────
function render() {
  const bar = $("results-bar");
  const cnt = $("results-count");
  bar.style.display = "";
  cnt.innerHTML = `<strong>${allRecords.length}</strong> record${allRecords.length!==1?"s":""}`;
  if (currentView === "log") renderLog();
  else renderTimeline();
}

// ── Session Log view ──────────────────────────────────────────────────────
function renderLog() {
  if (!allRecords.length) {
    $("main-content").innerHTML = `<div class="log-wrap"><div class="empty-state">No records found. Adjust filters above.</div></div>`;
    return;
  }

  // Split into Behavior / Slice ePhys sub-tabs (default Behavior)
  const behavRecs = allRecords.filter(r => r.experiment_type === "behavior");
  const sliceRecs = allRecords.filter(r => r.experiment_type === "slice");
  if (logSubTab === "slice" && !sliceRecs.length && behavRecs.length) logSubTab = "behavior";

  const subTabs = `<div class="view-tabs" style="margin-bottom:12px;">
    <button class="view-tab ${logSubTab==='behavior'?'active':''}" data-sub="behavior">🐭 Behavior (${behavRecs.length})</button>
    <button class="view-tab ${logSubTab==='slice'?'active':''}" data-sub="slice">🔬 Slice ePhys (${sliceRecs.length})</button>
  </div>`;

  let body;
  if (logSubTab === "slice") {
    body = sliceRecs.length
      ? `<div class="log-wrap">${renderSliceTable(sliceRecs)}</div>`
      : `<div class="log-wrap"><div class="empty-state">No slice ePhys records for these filters.</div></div>`;
  } else {
    body = behavRecs.length
      ? `<div class="log-wrap">${renderBehaviorTable(behavRecs)}</div>`
      : `<div class="log-wrap"><div class="empty-state">No behavior records for these filters.</div></div>`;
  }
  $("main-content").innerHTML = subTabs + body;

  document.querySelectorAll(".view-tab[data-sub]").forEach(b =>
    b.addEventListener("click", () => { logSubTab = b.dataset.sub; renderLog(); }));

  // Wire mouse-link clicks → switch to timeline for that mouse
  document.querySelectorAll(".mouse-link").forEach(el => {
    el.addEventListener("click", () => {
      const mid = el.dataset.mid;
      $("f-mouse").value = mid;
      $("tab-log"); // stay in log? actually switch to timeline
      setView("timeline");
      load();
    });
  });

  // Wire per-mouse Drop toggles → persist vor_okr_logs.dropout
  document.querySelectorAll(".drop-cb").forEach(cb => {
    cb.addEventListener("click", ev => ev.stopPropagation());
    cb.addEventListener("change", async () => {
      const mid = cb.dataset.mid, val = cb.checked;
      cb.disabled = true;
      try {
        await api("POST", `/api/vor-okr/${encodeURIComponent(mid)}/dropout`, { dropout: val });
        await load();
      } catch (err) {
        alert("Drop update failed: " + err.message);
        cb.checked = !val; cb.disabled = false;
      }
    });
  });
}

function renderSliceTable(recs) {
  const thead = `<tr>
    <th>Date</th><th>Project</th><th>Mouse</th><th>Strain</th>
    <th>Condition</th><th>Days in Cond</th><th>Age (wks)</th>
    <th>Exp Cond</th><th>Exp Type</th><th>Cell</th><th>Protocol</th>
    <th>Notes</th><th>Experimenter</th>
    <th title="Analysis results">Analysis</th>
  </tr>`;
  // Group records by note_id to build per-note analysis summary
  const notesSeen = new Set();
  const rows = recs.map(r => {
    const job  = analysisJobs[r.note_id];
    const res  = job?.result;
    // Only show analysis cell on the first row of each note
    const firstOfNote = !notesSeen.has(r.note_id);
    if (firstOfNote) notesSeen.add(r.note_id);

    let analysisCell = "";
    if (firstOfNote) {
      if (res) {
        const excelName = res.excel ? res.excel.split("/").pop() : null;
        const dlLink = excelName
          ? `<a href="/api/eln/analysis/results/${job.job_id}/${encodeURIComponent(excelName)}"
               target="_blank" style="color:#4338ca;font-size:11px;font-weight:700;">↓ Excel</a>`
          : "";
        analysisCell = `
          <div style="display:flex;flex-direction:column;gap:3px;min-width:110px;">
            <div style="display:flex;gap:5px;flex-wrap:wrap;">
              <span class="chip chip-calib-ok" style="font-size:10px;">✓ ${res.n_qualified ?? "—"}</span>
              <span class="chip chip-calib-no" style="font-size:10px;">✗ ${res.n_excluded ?? "—"}</span>
            </div>
            <div style="font-size:10px;color:var(--grey);">${res.n_cells ?? "—"} total · ${escHtml(res.protocol_mode||"")}</div>
            ${dlLink}
          </div>`;
      } else if (job?.status === "running" || job?.status === "pending") {
        analysisCell = `<span style="font-size:11px;color:var(--grey);">⏳ Running…</span>`;
      } else if (job?.status === "failed") {
        analysisCell = `<span style="font-size:11px;color:var(--red);">✗ Failed</span>`;
      } else {
        analysisCell = `<span style="font-size:11px;color:var(--grey);">—</span>`;
      }
    }

    return `<tr>
      <td>${fmtDate(r.date)}</td>
      <td style="font-size:11.5px;color:var(--grey)">${escHtml(r.project_slug||"")}</td>
      <td><a class="mouse-link" data-mid="${escHtml(r.mouse_id)}">${escHtml(r.mouse_id||"—")}</a>${sacBadge(r)}</td>
      <td>${escHtml(r.strain||"")}</td>
      <td>${r.condition ? `<span class="info-pill cond">${escHtml(r.condition)}</span>` : "—"}</td>
      <td>${r.days_in_condition != null ? `<span class="info-pill days">d${r.days_in_condition}</span>` : "—"}</td>
      <td>${r.age_weeks != null ? r.age_weeks : "—"}</td>
      <td>${escHtml(r.exp_condition||"—")}</td>
      <td>${escHtml(r.exp_type||"—")}</td>
      <td><b>${escHtml(r.cell||"—")}</b></td>
      <td>${r.protocol ? `<span class="info-pill prot">${escHtml(r.protocol)}</span>` : "—"}</td>
      <td style="max-width:180px;color:var(--grey);font-size:12px">${escHtml(r.notes||"")}</td>
      <td>${authorChip(r.author)}</td>
      <td>${analysisCell}</td>
    </tr>`;
  }).join("");
  return `<table class="log-table"><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
}

function sacBadge(r) {
  if (!r || !r.sacrificed) return "";
  const d = r.sacrificed_at ? " · " + fmtDate(r.sacrificed_at) : "";
  return ` <span title="Sacrificed — finalized slice recording" style="background:#3a3a3c;color:#fff;border-radius:999px;padding:1px 7px;font-size:9px;font-weight:800;letter-spacing:.03em;white-space:nowrap;">☠ SAC${d}</span>`;
}

const DISPO_META = {
  include: { label: "Include", bg: "#dff5e6", fg: "#1b7f3b" },
  exclude: { label: "Exclude", bg: "#fde2e0", fg: "#b3261e" },
  retest:  { label: "Re-test", bg: "#fdefd0", fg: "#8a5b00" },
  drop:    { label: "Drop",    bg: "#e5e5e7", fg: "#3a3a3c" },
};
function dispoTag(v, at) {
  if (!v) return "";
  const m = DISPO_META[v] || { label: v, bg: "#eee", fg: "#333" };
  return `<div style="margin-top:2px;"><span style="background:${m.bg};color:${m.fg};border-radius:999px;padding:1px 6px;font-size:9.5px;font-weight:700;">${escHtml(m.label)}</span>${at ? `<span style="font-size:9px;color:var(--grey);margin-left:3px;">${escHtml(at)}</span>` : ""}</div>`;
}

function renderBehaviorTable(recs) {
  // ── Group all records by mouse_id (preserving first-seen order by earliest date) ──
  const mouseOrder = [];
  const byMouse = {};
  for (const r of recs) {
    const mid = r.mouse_id || "(unknown)";
    if (!byMouse[mid]) { byMouse[mid] = []; mouseOrder.push(mid); }
    byMouse[mid].push(r);
  }
  // Sort mice by earliest session date
  mouseOrder.sort((a, b) => {
    const da = byMouse[a].map(r => r.date).filter(Boolean).sort()[0] || "";
    const db = byMouse[b].map(r => r.date).filter(Boolean).sort()[0] || "";
    return da < db ? -1 : 1;
  });

  // Find max number of VOR sessions and OKR sessions across all mice
  let maxVOR = 0, maxOKR = 0;
  for (const mid of mouseOrder) {
    const sessions = byMouse[mid].filter(r => r.entry_type !== "acclimatization");
    const vor = sessions.filter(r => (r.task||"").toUpperCase().includes("VOR")).length;
    const okr = sessions.filter(r => (r.task||"").toUpperCase().includes("OKR")).length;
    if (vor > maxVOR) maxVOR = vor;
    if (okr > maxOKR) maxOKR = okr;
  }
  maxVOR = Math.max(maxVOR, 1);
  maxOKR = Math.max(maxOKR, 1);

  // ── Header ──
  const vorHeaders = Array.from({length: maxVOR}, (_, i) =>
    `<th>VOR ${i+1}</th>`).join("");
  const okrHeaders = Array.from({length: maxOKR}, (_, i) =>
    `<th>OKR ${i+1}</th>`).join("");
  const thead = `<tr>
    <th>Mouse</th><th>Cohort</th><th>Strain</th><th>Sex</th>
    <th>Condition</th><th>Days in C</th><th>Age (wk)</th>
    <th>Acclim</th>
    ${vorHeaders}${okrHeaders}
    <th>Source</th>
  </tr>`;

  // ── Rows ──
  const rows = mouseOrder.map(mid => {
    const recs_m = byMouse[mid];
    // Pick the most recent non-legacy record for mouse meta, fall back to legacy
    const metaRec = [...recs_m].sort((a, b) => (b.date||"") > (a.date||"") ? 1 : -1)
      .find(r => r.source !== "legacy") || recs_m[0];

    const acclimRecs = recs_m
      .filter(r => r.entry_type === "acclimatization")
      .sort((a, b) => (a.date||"") < (b.date||"") ? -1 : 1);
    const vorRecs = recs_m
      .filter(r => r.entry_type !== "acclimatization" && (r.task||"").toUpperCase().includes("VOR"))
      .sort((a, b) => (a.date||"") < (b.date||"") ? -1 : 1);
    const okrRecs = recs_m
      .filter(r => r.entry_type !== "acclimatization" && (r.task||"").toUpperCase().includes("OKR"))
      .sort((a, b) => (a.date||"") < (b.date||"") ? -1 : 1);

    const sacRec = recs_m.find(r => r.sacrificed);
    const isDropped = recs_m.some(r => r.dropout || r.disposition === "drop");
    const dropCtl = `<label class="drop-toggle" title="Drop this mouse (VOR/OKR dropout)" style="display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:${isDropped ? '#b3261e' : 'var(--grey)'};cursor:pointer;user-select:none;"><input type="checkbox" class="drop-cb" data-mid="${escHtml(mid)}" ${isDropped ? 'checked' : ''} style="cursor:pointer;margin:0;"> DROP</label>`;

    const isPending = recs_m.length && recs_m.every(r => r.pending);
    const hasLegacy = recs_m.some(r => r.source === "legacy");
    const hasNew    = recs_m.some(r => r.source !== "legacy" && !r.pending);
    const sourceCell = isPending
      ? `<span title="Surgery done, no behavior sessions logged yet" style="font-size:9px;background:#fff4d6;color:#8a5b00;border-radius:4px;padding:1px 6px;font-weight:700;white-space:nowrap;">⏳ surgery · no sessions</span>`
      : hasNew && hasLegacy
      ? `<span class="chip chip-recording" style="font-size:10px;">ELN</span> <span style="font-size:9px;background:#f3f4f6;color:#9ca3af;border-radius:4px;padding:1px 5px;font-weight:700;">+legacy</span>`
      : hasNew
      ? `<span class="chip chip-recording" style="font-size:10px;">ELN</span>`
      : `<span style="font-size:9px;background:#f3f4f6;color:#9ca3af;border-radius:4px;padding:1px 5px;font-weight:700;">legacy</span>`;

    function sessionCell(r) {
      if (!r) return `<td>—</td>`;
      const calib = r.calibration_done
        ? `<span class="ok">✓</span>`
        : r.entry_type === "recording" && r.source !== "legacy" ? `<span class="no">✗</span>` : "";
      const sig = r.good_signal ? `<span class="sig">(${escHtml(r.good_signal)})</span>` : "";
      const memo = (r.experiment_notes || r.notes || "").trim();
      const memoEl = memo ? `<div class="memo" style="font-size:10.5px;color:var(--grey);margin-top:1px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(memo)}">${escHtml(memo)}</div>` : "";
      return `<td class="session-cell">
        <div class="session-date">${fmtDate(r.date)} ${calib} ${sig}</div>
        ${memoEl}
        ${dispoTag(r.disposition, r.disposition_at)}
      </td>`;
    }

    const acclimCell = acclimRecs.length
      ? `<td class="session-cell"><div class="acclim-dates">${acclimRecs.map(r => `<span class="acclim-chip">${fmtDate(r.date)}</span>`).join("")}</div></td>`
      : `<td>—</td>`;

    const vorCells = Array.from({length: maxVOR}, (_, i) => sessionCell(vorRecs[i])).join("");
    const okrCells = Array.from({length: maxOKR}, (_, i) => sessionCell(okrRecs[i])).join("");

    return `<tr>
      <td><a class="mouse-link" data-mid="${escHtml(mid)}" style="font-family:monospace;font-weight:700;">${escHtml(mid)}</a>${sacBadge(sacRec)}${dropCtl}</td>
      <td>${escHtml(metaRec.cohort||"—")}</td>
      <td>${escHtml(metaRec.strain||"—")}</td>
      <td>${escHtml(metaRec.sex||"—")}</td>
      <td>${metaRec.condition ? `<span class="info-pill cond">${escHtml(metaRec.condition)}</span>` : "—"}</td>
      <td>${metaRec.days_in_condition != null ? `<span class="info-pill days">d${metaRec.days_in_condition}</span>` : "—"}</td>
      <td>${metaRec.age_weeks != null ? metaRec.age_weeks : "—"}</td>
      ${acclimCell}${vorCells}${okrCells}
      <td>${sourceCell}</td>
    </tr>`;
  }).join("");

  return `<div style="overflow-x:auto;"><table class="log-table"><thead>${thead}</thead><tbody>${rows}</tbody></table></div>`;
}

function authorChip(author) {
  if (!author) return "—";
  const ini = (author.initials || (author.name||"?")[0]).toUpperCase();
  return `<div class="tl-author">
    <div class="tl-avatar" style="background:${escHtml(author.color||"#8E8E93")};color:#fff">${escHtml(ini)}</div>
    <span style="font-size:12px">${escHtml(author.name||"")}</span>
  </div>`;
}

// ── Mouse Timeline view ───────────────────────────────────────────────────
function renderTimeline() {
  if (!allRecords.length) {
    $("main-content").innerHTML = `<div class="empty-state">No records found. Adjust filters above.</div>`;
    return;
  }

  // Group by mouse_id
  const groups = {};
  for (const r of allRecords) {
    const mid = r.mouse_id || "(unknown)";
    if (!groups[mid]) groups[mid] = [];
    groups[mid].push(r);
  }

  const sortedMice = Object.keys(groups).sort();
  const cards = sortedMice.map(mid => {
    const recs = groups[mid];
    // Gather meta from most recent slice record
    const sliceRec = recs.find(r => r.experiment_type === "slice");
    const meta = sliceRec
      ? [sliceRec.strain, sliceRec.sex, sliceRec.age_weeks ? `${sliceRec.age_weeks}wks` : null].filter(Boolean).join(" · ")
      : "";

    const rows = recs.map(r => {
      const etype = r.experiment_type;
      const entType = r.entry_type || "";

      let typeTag = "";
      if (etype === "slice") typeTag = `<span class="chip chip-recording" style="font-size:10px">ePhys</span>`;
      else if (entType === "recording") typeTag = `<span class="chip chip-recording" style="font-size:10px">Recording</span>`;
      else if (entType === "acclimatization") typeTag = `<span class="chip chip-acclim" style="font-size:10px">Acclim</span>`;
      else if (entType === "training") typeTag = `<span class="chip chip-training" style="font-size:10px">Training</span>`;
      else typeTag = `<span class="chip chip-log" style="font-size:10px">${escHtml(entType||etype)}</span>`;

      let pills = "";
      if (etype === "slice") {
        if (r.condition) pills += `<span class="info-pill cond">${escHtml(r.condition)}</span>`;
        if (r.days_in_condition != null) pills += `<span class="info-pill days">d${r.days_in_condition}</span>`;
        if (r.exp_condition) pills += `<span class="info-pill">${escHtml(r.exp_condition)}</span>`;
        if (r.exp_type) pills += `<span class="info-pill">${escHtml(r.exp_type)}</span>`;
        if (r.cell) pills += `<span class="info-pill">cell ${escHtml(r.cell)}</span>`;
        if (r.protocol) pills += `<span class="info-pill prot">${escHtml(r.protocol)}</span>`;
        if (r.notes) pills += `<span style="font-size:11.5px;color:var(--grey)">${escHtml(r.notes.slice(0,60))}${r.notes.length>60?"…":""}</span>`;
      } else {
        if (r.task) pills += `<span class="info-pill">${escHtml(r.task)}</span>`;
        if (r.good_signal) pills += `<span class="info-pill signal">Signal: ${escHtml(r.good_signal)}</span>`;
        if (r.calibration_done) pills += `<span class="chip chip-calib-ok" style="font-size:10px">Calibrated</span>`;
        if (r.experiment_notes||r.notes) {
          const n = r.experiment_notes||r.notes;
          pills += `<span style="font-size:11.5px;color:var(--grey)">${escHtml(n.slice(0,60))}${n.length>60?"…":""}</span>`;
        }
      }

      return `<div class="tl-row">
        <div class="tl-date">${fmtDate(r.date)}</div>
        <div class="tl-type">${typeTag}</div>
        <div class="tl-body">${pills||`<span style="color:var(--grey);font-size:12px">—</span>`}</div>
        <div class="tl-author">${authorChip(r.author)}</div>
      </div>`;
    }).join("");

    return `<div class="mouse-card">
      <div class="mouse-card-head">
        <span class="mouse-id">${escHtml(mid)}</span>
        ${meta ? `<span class="mouse-meta">${escHtml(meta)}</span>` : ""}
        <span class="spacer"></span>
        <span class="count">${recs.length} record${recs.length!==1?"s":""}</span>
      </div>
      <div class="mouse-timeline">${rows}</div>
    </div>`;
  }).join("");

  $("main-content").innerHTML = `<div class="timeline-wrap">${cards}</div>`;
}

// ── View switcher ─────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.querySelectorAll(".view-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === v);
  });
  render();
}

// ── Wire events ───────────────────────────────────────────────────────────
document.querySelectorAll(".view-tab").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

$("f-type").addEventListener("change", () => {
  $("f-subtype-wrap").style.display = $("f-type").value === "behavior" ? "" : "none";
});

$("btn-apply").addEventListener("click", load);

$("btn-reset").addEventListener("click", () => {
  $("f-project").value = "";
  $("f-type").value = "";
  $("f-subtype").value = "";
  $("f-author").value = "";
  $("f-mouse").value = "";
  $("f-cohort").value = "";
  $("f-date-from").value = "";
  $("f-date-to").value = "";
  $("f-subtype-wrap").style.display = "none";
  load();
});

$("f-mouse").addEventListener("keydown", e => { if (e.key === "Enter") load(); });

// ── Start ─────────────────────────────────────────────────────────────────
boot();
</script>
<script src="/labos-nav.js" defer></script>
</body>
</html>
