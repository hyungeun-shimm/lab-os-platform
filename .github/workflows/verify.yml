name: Verify Lab OS
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify_release.sh
        env:
          LABOS_PYTHON: python
