<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="/labos-ui.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lab OS — Dashboard</title>
<style>
  :root {
    --navy: #1E2761;
    --navy-deep: #131A40;
    --ice: #CADCFC;
    --ice-deep: #8FB3E6;
    --accent: #F2B33D;
    --grey: #5A6378;
    --grey-light: #ECEEF3;
    --grey-lighter: #F6F7FB;
    --white: #FFFFFF;
    --green: #1F7A3A;
    --green-soft: #ecfdf5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Calibri, sans-serif;
    background: var(--grey-lighter); color: #1c2333; min-height: 100vh;
  }
  header.app-top {
    background: var(--navy); color: var(--white);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  header.app-top .brand { font-family: Georgia, serif; font-size: 18px; font-weight: 700; }
  header.app-top .brand-sub {
    color: var(--accent); font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; margin-left: 4px;
  }
  header.app-top a.back {
    color: var(--ice); text-decoration: none; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  header.app-top a.back:hover { color: var(--white); }
  header.app-top .crumbs { color: var(--ice-deep); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  header.app-top .crumbs strong { color: var(--white); }
  header.app-top .spacer { flex: 1; }
  header.app-top .me { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  header.app-top .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: var(--navy-deep);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  header.app-top .mode-pill {
    background: var(--accent); color: var(--navy-deep);
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  header.app-top .mode-pill.member { background: var(--ice-deep); color: var(--navy-deep); }

  main { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .page-head {
    background: var(--white); border-radius: 14px;
    padding: 18px 22px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05);
    display: flex; align-items: center; gap: 14px;
  }
  .page-head h1 { margin: 0; font-family: Georgia, serif; color: var(--navy); font-size: 22px; }
  .page-head .desc { color: var(--grey); font-size: 13px; margin-top: 2px; }
  .page-head .sync-area {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
  }
  .sync-info { font-size: 12px; color: var(--grey); }
  .sync-info strong { color: var(--navy); }
  .btn-sync {
    background: var(--navy); color: var(--white);
    border: 0; border-radius: 10px;
    padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-sync:hover { background: var(--navy-deep); }
  .btn-sync:disabled { background: var(--ice-deep); cursor: progress; }
  .btn-sync .spin {
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.5); border-top-color: var(--white);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    display: none;
  }
  .btn-sync.loading .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section {
    background: var(--white); border-radius: 14px;
    padding: 18px 22px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05);
  }
  .section h2 {
    margin: 0 0 12px; font-family: Georgia, serif;
    color: var(--navy); font-size: 16px;
  }

  table.t {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  table.t th {
    text-align: left; padding: 8px 12px;
    background: var(--grey-lighter);
    color: var(--grey); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--grey-light);
    white-space: nowrap;
  }
  table.t td {
    padding: 9px 12px; border-bottom: 1px solid var(--grey-lighter);
    vertical-align: middle;
  }
  table.t tbody tr:last-child td { border-bottom: 0; }
  table.t tbody tr.expandable { cursor: pointer; }
  table.t tbody tr.expandable:hover { background: var(--grey-lighter); }
  table.t .num { font-family: 'SF Mono', Consolas, monospace; font-weight: 700; color: var(--navy); }
  table.t .num.dim { color: var(--grey); font-weight: 400; }

  .who { display: flex; align-items: center; gap: 8px; }
  .who .av {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--navy-deep);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11.5px;
    flex-shrink: 0;
  }
  .who .name { font-weight: 600; }

  .bar-row {
    display: flex; align-items: center; gap: 8px;
  }
  .bar {
    flex: 1; height: 7px; background: var(--grey-lighter); border-radius: 999px; overflow: hidden;
    max-width: 200px;
  }
  .bar .fill-slice { background: rgb(99, 102, 241); height: 100%; display: inline-block; }
  .bar .fill-beh   { background: rgb(16, 185, 129); height: 100%; display: inline-block; }
  .bar-row .legend { font-size: 11.5px; color: var(--grey); font-family: 'SF Mono', Consolas, monospace; }

  .pill {
    display: inline-block;
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .pill.assigned { background: rgba(143, 179, 230, 0.30); color: var(--navy); }
  .pill.pilot    { background: rgba(242, 179, 61, 0.20); color: #8a5b00; }
  .pill.draft    { background: var(--grey-lighter); color: var(--grey); }
  .pill.final    { background: var(--green-soft); color: var(--green); }

  .by-project-detail {
    background: var(--grey-lighter);
    padding: 8px 12px 4px 50px;
    font-size: 12px;
  }
  .by-project-detail .bp-row {
    display: flex; gap: 12px; align-items: center;
    padding: 4px 0; border-bottom: 1px dashed var(--grey-light);
  }
  .by-project-detail .bp-row:last-child { border-bottom: 0; }
  .by-project-detail .bp-title {
    flex: 1; font-weight: 600; color: var(--navy);
  }
  .by-project-detail .bp-title a { color: var(--navy); text-decoration: none; }
  .by-project-detail .bp-title a:hover { text-decoration: underline; }
  .by-project-detail .bp-count {
    font-family: 'SF Mono', Consolas, monospace; color: var(--grey);
  }

  .empty {
    color: var(--grey); font-style: italic; padding: 30px 20px; text-align: center;
  }

  .err {
    color: #b91c1c; padding: 12px 16px; background: #fef2f2; border-radius: 8px;
  }

  .small-mute {
    color: var(--grey); font-size: 11.5px;
  }

  /* colony groups */
  .grp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px 18px;
  }
  .grp-block {
    background: var(--grey-lighter); border-radius: 10px;
    padding: 10px 12px 6px;
  }
  .grp-title {
    font-size: 10.5px; font-weight: 700; color: var(--grey);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  table.t.grp-t th, table.t.grp-t td { padding: 4px 6px; }
  table.t.grp-t { font-size: 12.5px; }
  table.t.grp-t tbody tr { background: transparent !important; }
  .grp-bar {
    height: 6px; background: var(--white); border-radius: 999px; overflow: hidden;
    min-width: 60px;
  }
  .grp-fill { display: block; height: 100%; }

  /* small chip used across colony rows */
  .small-chip {
    display: inline-block;
    background: var(--grey-lighter); color: var(--navy);
    border-radius: 999px; padding: 2px 9px;
    font-size: 11.5px; margin-right: 4px; margin-bottom: 3px;
  }

  /* cage cards */
  .cage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .cage-card {
    background: var(--grey-lighter); border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--grey-light);
  }
  .cage-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .cage-barcode {
    font-family: 'SF Mono', Consolas, monospace;
    font-weight: 700; color: var(--navy); font-size: 13px;
  }
  .cage-count {
    background: var(--white); color: var(--navy);
    border-radius: 999px; padding: 1px 8px;
    font-size: 11px; font-weight: 700;
  }
  .cage-mice {
    margin-bottom: 6px; line-height: 1.7;
  }
  .cage-mid {
    display: inline-block;
    background: var(--white); color: var(--navy);
    border-radius: 6px; padding: 1px 7px;
    font-family: 'SF Mono', Consolas, monospace; font-size: 11.5px; font-weight: 600;
    text-decoration: none; margin-right: 3px;
  }
  .cage-mid:hover { background: var(--ice); }
  .cage-meta { display: flex; flex-wrap: wrap; gap: 2px; }

  /* mouse-id chip with transfer button beside it */
  .cage-mid-wrap { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; }
  .cage-xfer {
    background: var(--white); color: var(--grey);
    border: 1px solid var(--grey-light); border-radius: 5px;
    padding: 0 4px; font-size: 10.5px; font-weight: 700; line-height: 1.4;
    cursor: pointer;
  }
  .cage-xfer:hover { background: var(--ice); color: var(--navy); border-color: var(--ice-deep); }

  /* scope toggle inside section h2 */
  .scope-toggle {
    background: var(--grey-lighter); color: var(--navy);
    border: 1px solid var(--grey-light); border-radius: 999px;
    padding: 3px 11px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .scope-toggle.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .scope-toggle:hover:not(.active) { background: var(--ice); }

  /* Transfer modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 60px 16px; z-index: 800;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white); border-radius: 14px;
    width: 100%; max-width: 460px;
    box-shadow: 0 24px 60px rgba(15,23,42,0.30);
  }
  .modal-head {
    padding: 14px 22px; border-bottom: 1px solid var(--grey-light);
    background: var(--grey-lighter);
    display: flex; align-items: center; justify-content: space-between;
    border-radius: 14px 14px 0 0;
  }
  .modal-head h3 { margin: 0; font-family: Georgia, serif; color: var(--navy); font-size: 16px; }
  .modal-close { background: transparent; border: 0; cursor: pointer; font-size: 22px; color: var(--grey); padding: 0 4px; }
  .modal-body { padding: 18px 22px; }
  .modal-foot {
    padding: 12px 22px; border-top: 1px solid var(--grey-light);
    background: var(--grey-lighter);
    display: flex; justify-content: flex-end; gap: 8px;
    border-radius: 0 0 14px 14px;
  }
  .modal-foot button {
    border: 0; border-radius: 9px;
    padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .modal-foot .cancel { background: var(--white); border: 1px solid var(--grey-light); color: var(--navy); }
  .modal-foot .go { background: var(--navy); color: var(--white); }
  .field-label {
    display: block; font-size: 10.5px; color: var(--grey); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 4px;
  }
  .field-input {
    width: 100%; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 8px 11px; font: inherit; font-size: 14px; background: var(--white);
    box-sizing: border-box;
  }
  .modal-msg {
    margin-top: 10px; padding: 9px 12px; border-radius: 7px;
    font-size: 12.5px; display: none;
  }
  .modal-msg.error { background: #fef2f2; color: #b91c1c; }
</style>
<style>
  .work-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:16px;}
  .work-grid .section {margin-bottom:0;max-height:360px;overflow:auto;}
  .page-head,.page-head .sync-area {flex-wrap:wrap;}
  .section {overflow:auto;}
  @media(max-width:700px){main{padding:12px}.work-grid{grid-template-columns:1fr}.page-head{padding:14px}.page-head .sync-area{margin-left:0;}}
</style>
</head>
<body>

<header class="app-top">
  <div>
    <span class="brand">Lab OS</span><span class="brand-sub">ELN</span>
  </div>
  <a class="back" href="/eln/">← Projects</a>
  <div class="crumbs">
    <span>/</span><strong>Dashboard</strong>
  </div>
  <div class="spacer"></div>
  <div class="me" id="me-area">Loading…</div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>📊 Today &amp; activity</h1>
      <div class="desc">Your schedule, unfinished work, and notes awaiting review.</div>
    </div>
    <div class="sync-area">
      <a href="/eln/colony" style="background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">🐭 Animal DB</a>
      <a href="/eln/breeders" style="background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">🧬 Breeders</a>
      <a href="/eln/members" id="mem-link" style="display:none;background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">👥 Members</a>
      <button id="sync-link" style="background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;">Animal sync history</button>
      <a href="/eln/permissions" id="perm-link" style="display:none;background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">🔐 Permissions</a>
      <a href="/eln/audit" id="audit-link" style="display:none;background:var(--white);color:var(--navy);border:1px solid var(--grey-light);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">🛡 Audit log</a>
      <div class="sync-info">
        <div>Updated: <strong id="sync-time">—</strong></div>
        <div id="sync-stale" style="display:none;color:#8a5b00;">⚠ Older than 1 day</div>
      </div>
      <button class="btn-sync" id="btn-sync">
        <span class="spin"></span>
        <span class="lbl">↻ Refresh</span>
      </button>
    </div>
  </div>

  <div id="content">
    <div class="section"><p class="empty">Loading…</p></div>
  </div>
</main>


<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let currentUser = null;
let lastData = null;
let workData = null;

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtRel(iso) {
  if (!iso) return "—";
  const t = new Date(iso).getTime();
  if (isNaN(t)) return iso;
  const diff = Date.now() - t;
  const m = Math.floor(diff / 60000);
  if (m < 1)   return "just now";
  if (m < 60)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 30)  return `${d}d ago`;
  return iso.slice(0, 10);
}
function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString();
}
async function api(method, path, body) {
  const opts = { method, credentials: "include", headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) {
    const detail = data?.detail;
    const msg = typeof detail === "string" ? detail : (detail?.detail || `HTTP ${r.status}`);
    const err = new Error(msg); err.status = r.status;
    throw err;
  }
  return data;
}

async function boot() {
  try {
    const me = await api("GET", "/api/eln/auth/me");
    currentUser = me.user;
    renderHeader();

    await sync();
  } catch (e) {
    if (e.status === 401) { window.location.href = "/eln/login"; return; }
    $("#content").innerHTML = `<div class="section"><div class="err">Failed: ${escapeHtml(e.message)}</div></div>`;
  }
}

function renderHeader() {
  const u = currentUser;
  const initials = u.initials || (u.display_name || "?")[0];
  const eff = u.effective_role;
  const badge = `<span class="mode-pill ${eff === "admin" ? "" : "member"}">${eff === "admin" ? "Admin mode" : "User mode"}</span>`;
  $("#me-area").innerHTML =
    `<div class="avatar" style="${u.color ? `background:${u.color}; color:#fff;` : ""}">${initials}</div>` +
    `<div>${u.display_name} ${badge}</div>`;
  if (eff === "admin") {
    $("#audit-link").style.display = "";
    $("#perm-link").style.display = "";
    $("#mem-link").style.display = "";
    $("#sync-link").style.display = "";
  }
}

async function sync() {
  const btn = $("#btn-sync");
  btn.disabled = true; btn.classList.add("loading");
  btn.querySelector(".lbl").textContent = "Refreshing…";
  try {
    const [data, work] = await Promise.all([api("GET", "/api/eln/dashboard"), api("GET", "/api/eln/workbench")]);
    lastData = data;
    workData = work;
    render(data);
  } catch (e) {
    $("#content").innerHTML = `<div class="section"><div class="err">Sync failed: ${escapeHtml(e.message)}</div></div>`;
  } finally {
    btn.disabled = false; btn.classList.remove("loading");
    btn.querySelector(".lbl").textContent = "↻ Refresh";
  }
}
$("#btn-sync").addEventListener("click", sync);
$("#sync-link").addEventListener("click", () => LabOS.syncHistory());
document.addEventListener('visibilitychange', () => { if (!document.hidden && currentUser) sync(); });
window.addEventListener('labos:animals-synced', () => { if (currentUser) sync(); });

function updateStaleWarning() {
  if (!lastData?.generated_at) return;
  const age = Date.now() - new Date(lastData.generated_at).getTime();
  $("#sync-stale").style.display = age > 86400000 ? "" : "none";
}

function render(d) {
  $("#sync-time").textContent = fmtTime(d.generated_at);
  updateStaleWarning();

  const isAdmin = d.is_admin;
  const usersSection = `
    <div class="section">
      <h2>${isAdmin ? "👥 Activity by user" : "👤 Your activity"}</h2>
      ${renderUsersTable(d.users)}
    </div>`;
  const projSection = `
    <div class="section">
      <h2>📁 Activity by project</h2>
      ${renderProjectsTable(d.projects)}
    </div>`;

  $("#content").innerHTML = renderWork(workData) + usersSection + projSection;
  wireExpandable(d);
}


function renderWork(w) {
  if (!w) return '';
  const events = items => items.length ? items.map(e => {
    const time = new Date(e.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    return `<p><a href="${escapeHtml(e.url)}" style="font-weight:600">${escapeHtml(time)} · ${escapeHtml(e.title)}</a><br><span class="small-mute">${escapeHtml([e.cohort,(e.mice || []).join(', '),e.rig,e.status].filter(Boolean).join(' · '))}</span></p>`;
  }).join('') : '<p class="empty">None.</p>';
  const notes = items => items.length ? items.map(n => `<p><a href="${escapeHtml(n.url)}">${escapeHtml(n.note_date)} · ${escapeHtml(n.project_slug)} · ${escapeHtml(n.author)}</a><br><span class="small-mute">${escapeHtml(LabOS.noteStatus(n))}</span></p>`).join('') : '<p class="empty">None.</p>';
  const report = w.sync_report || {};
  const issues = (report.counts?.rejected || 0) + (report.conflicts?.length || 0);
  return `<div class="work-grid">
    <div class="section"><h2>Today's schedule (${w.counts.today})</h2>${events(w.today)}</div>
    <div class="section"><h2>Overdue · last 30 days (${w.counts.overdue})</h2>${events(w.overdue)}</div>
    <div class="section"><h2>${w.is_admin ? 'Review queue' : 'Submitted for review'} (${w.counts.submitted})</h2>${notes(w.submitted)}</div>
    <div class="section"><h2>Draft notes (${w.counts.drafts})</h2>${notes(w.drafts)}</div>
  </div><div class="section"><a href="/eln/colony">🐭 My assigned animals: ${w.my_animals}</a> · Animal source updated: ${escapeHtml(fmtRel(w.last_synced))}${issues ? `<p style="color:#92400e">⚠ ${issues} animal synchronization issue(s). <button onclick="LabOS.syncHistory()">View details</button></p>` : ''}</div>`;
}

function renderUsersTable(users) {
  if (!users.length) return `<p class="empty">No activity to show.</p>`;
  const maxCount = Math.max(1, ...users.map(u => u.slice_recording + u.behavior));
  const rows = users.map((u, i) => {
    const total = u.slice_recording + u.behavior;
    const slicePct = Math.round((u.slice_recording / maxCount) * 100);
    const behPct   = Math.round((u.behavior        / maxCount) * 100);
    const projCount = Object.keys(u.by_project || {}).length;
    return `
      <tr class="expandable" data-uidx="${i}">
        <td>
          <div class="who">
            <div class="av" style="${u.color ? `background:${u.color}; color:#fff;` : ""}">${escapeHtml(u.initials || (u.display_name||"?")[0])}</div>
            <div>
              <div class="name">${escapeHtml(u.display_name)}</div>
              <div class="small-mute">${escapeHtml(u.username || "")}</div>
            </div>
          </div>
        </td>
        <td><span class="num">${total}</span></td>
        <td>
          <div class="bar-row">
            <div class="bar" title="🔬 Slice ${u.slice_recording} · 🐭 Behavior ${u.behavior}">
              <span class="fill-slice" style="width:${slicePct}%;"></span><span class="fill-beh" style="width:${behPct}%;"></span>
            </div>
            <span class="legend">${u.slice_recording}/${u.behavior}</span>
          </div>
        </td>
        <td><span class="num dim">${projCount}</span></td>
        <td><span class="pill final">${u.finalized} finalized</span> ${u.submitted ? `<span class="pill draft">${u.submitted} awaiting review</span>` : ''} ${u.draft ? `<span class="pill draft">${u.draft} draft</span>` : ''}</td>
        <td><span class="small-mute" title="${escapeHtml(u.last_active || '')}">${fmtRel(u.last_active)}</span></td>
        <td style="text-align:right;color:var(--grey);font-size:14px;"><span class="caret">▸</span></td>
      </tr>
      <tr class="detail-row" data-uidx="${i}" style="display:none;">
        <td colspan="7" style="padding:0;">
          <div class="by-project-detail">
            ${renderUserProjects(u.by_project)}
          </div>
        </td>
      </tr>`;
  }).join("");
  return `
    <table class="t">
      <thead>
        <tr>
          <th>User</th><th>Total</th><th>Slice / Behavior</th>
          <th>Projects</th><th>Status</th><th>Last active</th><th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="small-mute" style="margin:8px 0 0;">Click a row to see per-project breakdown.</p>
  `;
}

function renderUserProjects(byProject) {
  const entries = Object.entries(byProject || {});
  if (!entries.length) return `<p class="empty" style="padding:10px;">No project activity.</p>`;
  return entries.sort((a,b) => (b[1].slice_recording + b[1].behavior) - (a[1].slice_recording + a[1].behavior))
    .map(([slug, c]) => `
      <div class="bp-row">
        <div class="bp-title"><a href="/eln/project/${encodeURIComponent(slug)}">${escapeHtml(slug)}</a></div>
        <div class="bp-count">🔬 ${c.slice_recording || 0} · 🐭 ${c.behavior || 0}</div>
      </div>`).join("");
}

function renderProjectsTable(projects) {
  if (!projects.length) return `<p class="empty">No projects.</p>`;
  const rows = projects.map(p => `
    <tr>
      <td>
        <a href="/eln/project/${encodeURIComponent(p.slug)}" style="color:var(--navy);font-weight:600;text-decoration:none;">${escapeHtml(p.title)}</a>
        <span class="small-mute" style="margin-left:6px;font-family:'SF Mono',Consolas,monospace;">${escapeHtml(p.slug)}</span>
      </td>
      <td><span class="pill ${p.kind}">${escapeHtml(p.kind)}</span></td>
      <td><span class="num">${p.total_notes}</span></td>
      <td>
        <span class="num dim">🔬 ${p.slice_recording}</span> ·
        <span class="num dim">🐭 ${p.behavior}</span>
      </td>
      <td>${p.unique_users}</td>
      <td><span class="pill final">${p.finalized} finalized</span> ${p.submitted ? `<span class="pill draft">${p.submitted} awaiting review</span>` : ''} ${p.draft ? `<span class="pill draft">${p.draft} draft</span>` : ''}</td>
      <td><span class="small-mute" title="${escapeHtml(p.last_active || '')}">${fmtRel(p.last_active)}</span></td>
    </tr>`).join("");
  return `
    <table class="t">
      <thead>
        <tr>
          <th>Project</th><th>Kind</th><th>Total notes</th>
          <th>By type</th><th>Members</th><th>Status</th><th>Last active</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function wireExpandable() {
  $$("tr.expandable").forEach(tr => {
    tr.addEventListener("click", () => {
      const idx = tr.dataset.uidx;
      const detail = document.querySelector(`tr.detail-row[data-uidx="${idx}"]`);
      if (!detail) return;
      const caret = tr.querySelector(".caret");
      if (detail.style.display === "none") {
        detail.style.display = ""; if (caret) caret.textContent = "▾";
      } else {
        detail.style.display = "none"; if (caret) caret.textContent = "▸";
      }
    });
  });
}

document.addEventListener("click", () => {
  const menu = document.getElementById("archive-menu");
  if (menu) menu.style.display = "none";
});

boot();
</script>
<script src="/labos-nav.js" defer></script>
</body>
</html>
